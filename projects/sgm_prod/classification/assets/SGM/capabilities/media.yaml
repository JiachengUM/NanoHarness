      - 把播放模式设为
      - 把播放换成
      - 让播放变成
      - 帮我设为
      - 更换为
      - 播放源切换
      - 切换播放源
      - 更换播放源
      - 更改播放源
      - 帮我切换播放源
      - 把播放源切换
