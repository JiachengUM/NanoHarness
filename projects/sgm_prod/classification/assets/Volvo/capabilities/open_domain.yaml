executor: 联网
description: 联网搜索和开放信息查询不由 parser 直接证明 simple，只把明确开放信息类意图送入 Volvo LLM fallback 做最终边界判断。
capabilities:
  - id: open_domain.web_search.query
    name: 联网搜索和开放信息查询
    required_slots:
      - action
      - target
    targets:
      - 联网搜索
    actions:
      - 帮我搜一下
      - 帮我搜
      - 搜一下
      - 搜索一下
      - 帮我查一下
      - 帮我查
      - 查一下
    target_policy: open_after_action
    route_policy: llm_fallback
    intent_marker_policy: override_cross_executor
    intent_markers:
      - 介绍一下
      - 帮我搜
      - 搜一下
      - 搜索一下
      - 攻略
      - 玩法
      - 怎么玩
      - 一家三口
