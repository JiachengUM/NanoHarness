    name: 音乐搜索
    required_slots:
      - action
      - target
    targets:
      - 音乐
      - 歌曲
      - 歌
      - QQ音乐
      - 网易云
      - 如果可以
      - BGM
      - bgm
      - 背景音乐
      - 插曲
      - 舞曲
      - 配乐
      - 曲目
      - 单曲
      - 纯音
      - 纯音乐
      - 老歌
      - 合唱
      - 翻唱
      - 现场版
      - 原声
