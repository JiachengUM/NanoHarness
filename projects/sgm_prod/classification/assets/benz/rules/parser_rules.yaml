# Parser 级共享规则：只放解析流程需要的横向信号，不放具体执行能力。
#
# 归属原则：
# - 能被某个工具执行的 action/target/value：放 capabilities/*.yaml。
# - 多张 card 共享的同义词：放 lexicon.yaml。
# - 未消费文本命中后应降级复杂链路的风险词：放 global_risks.yaml。
# - parser 流程需要、但不属于某个执行器能力的填充词/疑问词/场景辅助词：放这里。

harmless_fillers:
  - 把
  - 请
  - 帮我
  - 给我
  - 你
  - 好
  - 我要
  - 我想
  - 我有点
  - 有点
  - 给
  - 给咱
  - 咱
  - 麻烦
  - 快
  - 赶快
  - 来
  - 当前
  - 目前
  - 现在
  - 当下
  - 此刻
  - 太
  - 我
  - 一下
  - 一点
  - 一首
  - 首
  - 听听
  - 功能
  - 那个
  - 这个
  - 的
  - 了
  - 吧
  - 哈
  - 呀
  - 啦
  - 哟
  - 咯
  - 吗
  - 呢
  - 啊
  - 然后
  - 就
  - 要
  - 想
  - 是多少
  - 是多少度
  - 是啥
  - 怎么样
  - 咋样

# 用于识别“未被当前 card 消费的额外取值信号”，辅助多意图 veto。
# 具体能力可接受的值仍应写在 card.values.patterns。
generic_value_patterns:
  - '\d+(?:度|%|档)'
  - '[零一二两三四五六七八九十百]+(?:度|档|挡)'

# 这些 canonical 只是维护分组，不代表同一真实目标。
# 例如“灯光”组里同时出现近光/远光时，不能被折叠成一个 target。
broad_target_canonicals:
  - 通用车控
  - 座椅舒适
  - 灯光
  - 车窗

# 这些能力本身就是状态/查询，不因普通疑问句自动复杂。
query_like_capabilities:
  - open_domain.weather.query
  - vehicle.status.query
  - vehicle.lock.status
  - vehicle.climate_status.query
  - system.location.status

question_or_condition_markers:
  - 是多少
  - 是否
  - 有没有
  - 历史
  - 下次
  - 剩余
  - 平均
  - 累计
  - 自启动
  - 手动归零
  - 开了吗
  - 开了么
  - 要开吗
  - 要不要
  - 是不是
  - 正常不
  - 强不强
  - 晒不晒
  - 几档
  - 档位是多少
  - 什么状态
  - 怎么样
  - 怎样
  - 啥
  - 吗

conditional_markers:
  - 没开的话
  - 有问题的话
  - 的话
  - 如果

# 场景化辅助词不是独立能力，只能在对应 card 完整命中后解释残留。
# 例：“屁股好热，开通风”里“屁股/好热”只辅助座椅通风，不应成为宽泛 simple 证据。
