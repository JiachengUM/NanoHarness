    name: 播放进度控制
    required_slots:
      - action
    targets:
      - 播放
      - 音乐
      - 视频
    actions:
      - 快进
      - 快退
    residue_policy: safe_modifier
  - id: media.radio.tune
    name: 收音机调频
    required_slots:
      - target
    targets:
      - FM
      - 收音机
      - 电台
    actions:
      - 打开
      - 播放
      - 调到
    residue_policy: safe_modifier
  - id: media.playback.start
    name: 开始播放
    required_slots:
      - action
    targets:
      - 音乐
      - 歌
      - 歌曲
    actions:
      - 播放
      - 播放音乐
      - 放音乐
      - 放歌
      - 听歌
      - 听音乐
      - 来点音乐
