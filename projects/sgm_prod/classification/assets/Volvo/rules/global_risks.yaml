risks:
  - risk_id: multi_turn
    patterns: [用户说, 车机, 过5秒, 我是说, 继续说, 上一轮, 来着, 记住, 刚才]
  # 强多意图连接词：命中即直接进入 global veto，并视作 residue 不安全。
  - risk_id: multi_capability_connector
    patterns: [同时, 并且, 顺便, 一起, 再去, 然后去, 接着去]
    severity: strong
  # 弱多意图连接词：单独出现不视作多意图，必须同时含 extra capability 才升级。
  # 仅供 parser 在 residue 安全判定 / multi_capability veto 配对时使用，不进 global veto。
  - risk_id: intent_weak_connector
    patterns: [和, 与, 及, 并, 但, 除了, 其他, 然后, 再, 也, 的话, 还是, "，", "、", ","]
    severity: weak
  # conditional_automation 只保留强自动化触发模式；
  # "自动开启/关闭/放下/停止" 是车控功能名（前除霜/后视镜/自动驾驶等），不应单独 veto。
  - risk_id: conditional_automation
    patterns: [如果, 每天, 检测到, 感应, 预约, 每次我, 过程中,
               锁车时, 阳光刺眼时, 运动模式时, 露营模式, 情景模式, 人体舒适]
  - risk_id: unresolved_reference
    patterns: [也这样, 老规矩, 那个窗]
  # 导航治理风险：这些词通常表示路线规划、POI筛选、多停靠、接送站或违法/危险诉求；
  # 命中未消费文本时不走 simple 白名单，交给 LLM/复杂链路判断。
  - risk_id: navigation_complex_request
    patterns: [途经, 途径, 沿途, 依次, 中途, 顺带, 再到, 最后去, 先去, 再去,
               回家, 规划, 路线, 绕行, 封路, 施工, 管制, 拥堵,
               评分, 人均, 酒店, 景点, 停车, 停车场, 充电桩, 加油站,
               全程, 高架, 超充站, 咖啡店, 买杯咖啡, 篮球场, 川菜馆,
               买一杯, 小吃, 吃饭, 餐厅, 带娃, 清明节, 行程, 上周, 常去,
               人少, 人气, 风景, 游玩, 红绿灯, 吃完,
               接人, 接站, 接送, 接孩子, 送朋友, 出站口, 进站口,
               营业时间, 开放时间, 建成时间, 地址, 人流, 查找, 找几个,
               哪里, 哪个, 自动调整, 根据, 自驾游, 出差,
               路程, 预计时长, 健身房, 航站楼, 人堆,
               能开到, 电量还剩10km,
               段子, 林黛玉, 四川话, 唱一首, 室外温度,
               逆行, 违禁, 赌钱, 想撞, 不想活, 超速, 喝点酒, 抽个烟, 点火]
  - risk_id: scene_goal
    patterns: [小朋友, 后排有儿童, 带孩子, 睡着, 快到隧道]
  - risk_id: emotion_scene
    patterns: [心情不好, 心情不太好, 安慰, 累死了, 害怕, 异味, 都是汗, 晒晒太阳,
               真冷, 透气, 透透气]
  # "节奏" 单字会误伤 "节奏舒缓的歌"；改为复合 pattern "节奏闪动" + 保留 "跟着/闪动" 共现。
  - risk_id: open_ended_planning
    patterns: [比较, 选个, 挑, 顺路, 推荐, 排队, 除了, 接我, 家附近, 我俩, 好好想想, 外婆家, 女朋友, 男朋友,
               偶像, 帮我设置一下空调, 帮我设置空调, 随大灯, 跟着, 节奏闪动, 闪动, 风扇转速, 吹风模式, 空气进来, 适合旅游]
  - risk_id: errand_or_ordering
    patterns: [出发去找, 找个全家, 买冰淇凌, 买冰淇淋, 点个, 点单, 下单]
  - risk_id: future_weather_range
    patterns: [未来3天, 未来5天, 未来两天, 未来一周, 未来30天, 后天, 大后天, 下个周末,
               本周一, 本周二, 本周三, 本周四, 本周五, 本周六, 本周日, 本周末,
               下周一, 下周二, 下周三, 下周四, 下周五, 下周六, 下周日,
               儿童节, 端午, 春节, 国庆, 中秋, 元旦, 5月20日, 30天的天气]
