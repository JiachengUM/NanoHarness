  - id: media.current.status.query
    name: 当前播放状态查询
    required_slots:
      - target
    targets:
      - 播放状态
      - 当前播放状态
      - 播放列表
      - 当前播放列表
    actions:
      - 查询
      - 查看
      - 帮我查
      - 让我看
      - 打开
