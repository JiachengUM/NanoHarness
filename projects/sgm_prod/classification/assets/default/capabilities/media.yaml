      - 副驾屏声音
      - 腾讯视频声音
      - 爱奇艺声音
      - 静音
    actions:
      - 大点声
      - 小点声
      - 大声一点
      - 小声一点
      - 大声点
      - 小声点
      - 声音大一点
      - 声音小一点
      - 声音大点
      - 声音小点
      - 调大
      - 调小
      - 调低
      - 调高
      - 提高
      - 加大
      - 大一点
      - 小一点
